@if (confirmService.request(); as req) {
  <div class="overlay" (click)="confirmService.respond(false)">
    <div class="dialog" (click)="$event.stopPropagation()">
      <button class="close-btn" title="Cancel" (click)="confirmService.respond(false)">✕</button>
      <h3>{{ req.title }}</h3>
      <p>{{ req.message }}</p>
      <div class="actions">
        <button class="cancel-btn" (click)="confirmService.respond(false)">Cancel</button>
        <button class="confirm-btn" (click)="confirmService.respond(true)">{{ req.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
