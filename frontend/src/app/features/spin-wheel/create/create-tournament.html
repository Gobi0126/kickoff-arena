<div class="page">
  <a class="back-link" routerLink="/spin-wheel">← Back to Spin Wheel</a>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Create a Spin Wheel Tournament</h1>
    <p class="subtitle">Set the name and how many players will register</p>

    <label for="name">Tournament name</label>
    <input id="name" type="text" formControlName="name" placeholder="Friday Night Spin" />

    <label for="bracket_size">Number of players</label>
    <input
      id="bracket_size"
      type="number"
      formControlName="bracket_size"
      min="2"
      max="64"
      step="2"
      placeholder="e.g. 6, 8, 12..."
    />
    <p class="hint">Any even number — players who don't fit a full bracket auto-advance round 1</p>
    @if (bracketSizeErrors) {
      <p class="error">{{ bracketSizeErrors }}</p>
    }

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating...' : 'Create Tournament' }}
    </button>
  </form>
</div>
