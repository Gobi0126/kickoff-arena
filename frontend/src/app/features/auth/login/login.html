<div class="auth-page">
  <div class="field-lines"></div>

  <a class="brand" routerLink="/">⚽ Kickoff Arena</a>

  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <span class="badge">Admin</span>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your tournaments</p>

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" formControlName="phone" autocomplete="username" placeholder="98765 43210" />

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>

    <p class="switch">
      New here? <a routerLink="/signup">Create a tournament account</a>
    </p>
  </form>
</div>
